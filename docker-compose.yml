services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./backend/public:/var/www/backend/public:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  backend:
    build:
      context: .
      dockerfile: deploy/php/Dockerfile
    working_dir: /var/www/backend
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    build:
      context: .
      dockerfile: deploy/node/Dockerfile
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-digital_marketplace}
      MYSQL_USER: ${DB_USERNAME:-marketplace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-marketplace_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.4-alpine
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules:
